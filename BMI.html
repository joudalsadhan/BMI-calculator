<!-- Main HTML for the BMI Calculator web page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>

        <div class="input-group" id="group-name">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <div class="error" id="error-name"></div>
        </div>

        <div class="input-group" id="group-email">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
            <div class="error" id="error-email"></div>
        </div>

        <div class="input-group" id="group-gender">
            <label for="gender">Gender:</label>
            <select id="gender">
              <option value="">-- Select Gender --</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
            <div class="error" id="error-gender"></div>
        </div>

        <div class="input-group" id="group-weight">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="Enter weight in kg">
            <div class="error" id="error-weight"></div>
        </div>

        <div class="input-group" id="group-height">
            <label for="height">Height (cm):</label>
            <input type="number" id="height" placeholder="Enter height in cm">
            <div class="error" id="error-height"></div>
        </div>

        <button id="calculateBtn">Calculate BMI</button>
        <button id="resetBtn" type="button">Reset</button>

        <div id="result"></div>
        <div id="healthNotes"></div>
    </div>

    <script src="bmi.js"></script>
</body>
</html>
